<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portix — Self-hosted tunnels for your local apps</title>

    <meta
      name="description"
      content="Portix lets you securely expose your local applications through public URLs using your own self-hosted tunnel server."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Portix — Self-hosted tunnels for your local apps"
    />
    <meta
      property="og:description"
      content="Securely expose your local applications through public URLs using your own self-hosted tunnel server."
    />
    <meta property="og:url" content="https://portix.io.vn/" />
    <meta property="og:image" content="https://portix.io.vn/og-image.png" />
    <meta
      property="og:image:alt"
      content="Portix — Self-hosted tunnels for your local apps"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Portix — Self-hosted tunnels for your local apps"
    />
    <meta
      name="twitter:description"
      content="Securely expose your local applications through public URLs using your own self-hosted tunnel server."
    />
    <meta name="twitter:image" content="https://portix.io.vn/og-image.png" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
