name: Release Portix.Client

# Manual only — never fires on push/PR. See openspec/changes/add-client-update-command for why.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without a leading 'v' (e.g. 1.2.0)"
        required: true
        type: string
      server-url:
        description: "Public Portix.Server URL to bake in as the default (e.g. https://tunnel.example.com:5100) — never committed, only used for this build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build dashboard
        # Vite's outDir (see dashboard/vite.config.ts) writes straight into
        # src/Portix.Client/wwwroot, which is gitignored — a fresh checkout has none of it, so
        # this has to run before publishing or the released exe embeds an empty dashboard.
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Set the release server URL
        # appsettings.json ships with a localhost default for local development; only this
        # checked-out copy on the runner gets patched to the real server URL — never committed.
        run: |
          $path = "src/Portix.Client/appsettings.json"
          $json = Get-Content -Path $path -Raw | ConvertFrom-Json
          $json.Portix.ServerUrl = "${{ inputs.server-url }}"
          $json | ConvertTo-Json -Depth 10 | Set-Content -Path $path

      - name: Publish all platforms
        run: ./scripts/publish-portix-client.ps1 -Version "${{ inputs.version }}"

      - name: Stage release assets with final names and checksums
        run: |
          $stageDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $assets = @(
            @{ Rid = "win-x64"; SourceName = "portix.exe"; FinalName = "portix-win-x64.exe" },
            @{ Rid = "osx-x64"; SourceName = "portix"; FinalName = "portix-osx-x64" },
            @{ Rid = "osx-arm64"; SourceName = "portix"; FinalName = "portix-osx-arm64" }
          )

          foreach ($asset in $assets) {
            $sourcePath = "publish/portix-client-$($asset.Rid)/$($asset.SourceName)"
            $destPath = Join-Path $stageDir $asset.FinalName
            Copy-Item -Path $sourcePath -Destination $destPath

            $hash = (Get-FileHash -Path $destPath -Algorithm SHA256).Hash.ToLower()
            "$hash  $($asset.FinalName)" | Set-Content -Path "$destPath.sha256" -NoNewline
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.version }}"
          # PowerShell doesn't glob-expand wildcards for native-exe arguments the way bash
          # does — resolve the asset paths explicitly and splat them.
          $assetPaths = (Get-ChildItem -Path "release-assets" -File).FullName
          gh release create "v$version" `
            --title "v$version" `
            --notes "Portix.Client v$version" `
            @assetPaths
