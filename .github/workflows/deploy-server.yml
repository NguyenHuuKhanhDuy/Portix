name: Deploy Server

# Manual only — this restarts the live production service, so it should never fire on push.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        working-directory: src/Portix.Server
        run: dotnet publish -c Release -o ./publish

      - name: Clean remote target directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: rm -rf /var/www/portix/*

      - name: Upload publish/ over SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "src/Portix.Server/publish/*"
          target: "/var/www/portix/"
          strip_components: 3
          overwrite: true

      - name: Restart service and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            sudo systemctl restart portix
            sleep 2
            sudo systemctl status portix --no-pager
            echo "--- last 50 log lines ---"
            sudo journalctl -u portix -n 50 --no-pager
            echo "--- listening ports ---"
            sudo ss -lntp | grep -E '5100|5101|8080' || true
